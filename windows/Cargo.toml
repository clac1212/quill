[package]
name = "quill"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fully local meeting recorder and transcriber — Windows implementation"

[lib]
name = "quill"
path = "src/lib.rs"

[[bin]]
name = "quill-probe"
path = "src/bin/probe.rs"

[features]
default = []
# M2: becomes ["dep:sherpa-onnx"]; the probe never enables it.
transcribe = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# windows-core is named explicitly because #[implement] expands to
# ::windows_core::* paths.
[target.'cfg(windows)'.dependencies]
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
]
